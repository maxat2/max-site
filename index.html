{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ================= рендер: штриховка + контуры ================= */
// ---- производительность: лимит кадров, адаптивное разрешение, режим простоя
const IS_MOBILE = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
const MAX_DPR = Math.min(devicePixelRatio, IS_MOBILE ? 1.0 : 1.5);
const MIN_DPR = 0.75;
const TARGET_FPS = 30, IDLE_FPS = 8, IDLE_AFTER = 45000;
let DPR = MAX_DPR;
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
document.getElementById('loading').remove();
const canvas = renderer.domElement;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.05, 60);
const PAPER_BG = new THREE.Color().setRGB(0.91, 0.918, 0.94, THREE.LinearSRGBColorSpace);
const NORMAL_BG = new THREE.Color().setRGB(0.5, 0.5, 1.0, THREE.LinearSRGBColorSpace);

scene.add(new THREE.HemisphereLight(0xffffff, 0xb0b0b0, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.position.set(-1.6, 4.0, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -2.6, right: 2.6, top: 2.6, bottom: -2.6, near: 0.5, far: 12 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

const shared = { uBoil: { value: 0 }, uDpr: { value: DPR } };
const HATCH_HEAD = `
uniform float uBoil; uniform float uDpr;
float hh21(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
float hline(vec2 p, float ang, float sp, float w){
  vec2 d = vec2(cos(ang), sin(ang)); float v = dot(p, d);
  float row = floor(v / sp);
  float g = abs(fract(v / sp) - 0.5) * sp;
  float k = 1.0 - smoothstep(w * 0.5, w * 0.5 + 0.9, g);
  float along = dot(p, vec2(-d.y, d.x));
  float brk = step(0.18, hh21(vec2(row, floor(along / 37.0) + uBoil)));   // разрывы штрихов
  return k * (0.55 + 0.45 * brk);
}
`;
const HATCH_BODY = `
  float Lin = clamp(dot(outgoingLight, vec3(0.2126, 0.7152, 0.0722)), 0.0, 1.0);
  float L = pow(Lin, 1.0 / 2.2);
  vec2 hp = gl_FragCoord.xy / uDpr;
  hp += vec2(sin(hp.y * 0.045 + uBoil * 1.7), cos(hp.x * 0.045 + uBoil * 2.3)) * 1.3;
  float ink = 0.0;
  ink = max(ink, hline(hp,  0.78, 6.5, 1.0) * smoothstep(0.70, 0.60, L) * 0.7);
  ink = max(ink, hline(hp, -0.78, 6.5, 1.0) * smoothstep(0.48, 0.38, L) * 0.85);
  ink = max(ink, hline(hp,  0.05, 4.6, 1.1) * smoothstep(0.30, 0.21, L));
  ink = max(ink, smoothstep(0.17, 0.05, L) * 0.92);
  vec3 paperC = vec3(0.985, 0.98, 0.968);
  gl_FragColor = vec4(mix(paperC, vec3(0.07, 0.07, 0.09), ink), diffuseColor.a);
`;
function M(tone = 0.92, extra = {}) {
  const m = new THREE.MeshLambertMaterial({ color: new THREE.Color(tone, tone, tone), ...extra });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uBoil = shared.uBoil; sh.uniforms.uDpr = shared.uDpr;
    sh.fragmentShader = HATCH_HEAD + sh.fragmentShader.replace('#include <opaque_fragment>', HATCH_BODY);
  };
  m.customProgramCacheKey = () => 'hatch1';
  return m;
}

// цели рендера
const rtColor = new THREE.WebGLRenderTarget(1, 1, { samples: IS_MOBILE ? 2 : 4, type: THREE.HalfFloatType });
const rtNormal = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
rtNormal.depthTexture = new THREE.DepthTexture(1, 1);
const normalMat = new THREE.MeshNormalMaterial();
const post = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: rtColor.texture }, tNormal: { value: rtNormal.texture }, tDepth: { value: rtNormal.depthTexture },
    uRes: { value: new THREE.Vector2() }, uBoil: shared.uBoil, uDpr: shared.uDpr,
    uNear: { value: camera.near }, uFar: { value: camera.far },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform sampler2D tColor, tNormal, tDepth; uniform vec2 uRes; uniform float uBoil, uDpr, uNear, uFar;
    float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+1.0), f.x), f.y); }
    float invDepth(vec2 uv){ float z = texture2D(tDepth, uv).x * 2.0 - 1.0;
      float d = 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear)); return 1.0 / d; }
    void main(){
      vec2 px = 1.0 / uRes;
      vec2 q = vUv * uRes / (34.0 * uDpr);
      vec2 w = vec2(vn(q + uBoil * 7.3), vn(q + uBoil * 3.1 + 17.0)) - 0.5;
      vec2 uv = vUv + w * px * 3.0 * uDpr;                       // «дрожание» линий
      float o = 1.15 * uDpr;
      vec3 nc = texture2D(tNormal, uv).xyz;
      float ne = length(texture2D(tNormal, uv + vec2(o,0.)*px).xyz - nc) + length(texture2D(tNormal, uv - vec2(o,0.)*px).xyz - nc)
               + length(texture2D(tNormal, uv + vec2(0.,o)*px).xyz - nc) + length(texture2D(tNormal, uv - vec2(0.,o)*px).xyz - nc);
      float dc = invDepth(uv);
      float de = abs(invDepth(uv + vec2(o,0.)*px) + invDepth(uv - vec2(o,0.)*px) - 2.0*dc)
               + abs(invDepth(uv + vec2(0.,o)*px) + invDepth(uv - vec2(0.,o)*px) - 2.0*dc);
      de /= max(dc, 1e-4);
      float e = max(smoothstep(0.32, 0.75, ne), smoothstep(0.012, 0.035, de));
      e *= 0.72 + 0.28 * vn(vUv * uRes / (2.5 * uDpr) + uBoil * 11.0);  // карандашная зернистость
      vec3 col = texture2D(tColor, vUv).rgb;
      col = mix(col, vec3(0.075, 0.078, 0.095), clamp(e, 0.0, 1.0));
      col *= 0.975 + 0.025 * h21(floor(vUv * uRes / (1.5 * uDpr)));
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
const noNormalPass = [];

function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.fov = camera.aspect < 1 ? 62 : 48; camera.updateProjectionMatrix();
  renderer.setPixelRatio(DPR); shared.uDpr.value = DPR;
  renderer.setSize(w, h);
  const pw = Math.floor(w * DPR), ph = Math.floor(h * DPR);
  rtColor.setSize(pw, ph); rtNormal.setSize(pw, ph);
  post.uniforms.uRes.value.set(pw, ph);
}
addEventListener('resize', resize);

/* ================= хелперы ================= */
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const rnd = (a, b) => a + Math.random() * (b - a);
function add(geo, mat, pos = [0, 0, 0], parent = scene, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos);
  m.castShadow = opts.cast !== false; m.receiveShadow = opts.recv !== false;
  parent.add(m); return m;
}
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy = 8;
  return { tex: t, ctx, canvas: c, redraw() { ctx.clearRect(0, 0, w, h); draw(ctx, w, h); t.needsUpdate = true; } };
}
function wobblyLine(ctx, x1, y1, x2, y2, amp = 2) {
  ctx.beginPath(); ctx.moveTo(x1 + rnd(-amp, amp), y1 + rnd(-amp, amp));
  const n = 4;
  for (let i = 1; i <= n; i++) { const k = i / n; ctx.lineTo(x1 + (x2 - x1) * k + rnd(-amp, amp), y1 + (y2 - y1) * k + rnd(-amp, amp)); }
  ctx.stroke();
}
const HAND = "'Caveat', cursive";

/* ================= пол и бумажные стопки ================= */
add(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), M(0.95), [0, 0, 0], scene, { cast: false });
const paperM = M(0.97);
function paperStack(x, y, z, height, w = 0.42, d = 0.3, parent = scene) {
  const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g);
  let h = 0;
  while (h < height) {
    const bh = rnd(0.05, 0.11);
    const b = add(new THREE.BoxGeometry(w + rnd(-0.015, 0.02), bh, d + rnd(-0.01, 0.02)), paperM, [rnd(-0.012, 0.012), h + bh / 2, rnd(-0.012, 0.012)], g);
    b.rotation.y = rnd(-0.05, 0.05);
    h += bh;
  }
  return g;
}
paperStack(-1.5, 0, -0.75, 1.75, 0.5, 0.36);
paperStack(-1.15, 0, -0.95, 1.25, 0.48, 0.34);
paperStack(1.45, 0, -0.7, 1.9, 0.5, 0.36);
paperStack(1.75, 0, -1.2, 1.4, 0.46, 0.34);

/* ================= стол ================= */
const T = 0.78, S = T;
const deskM = M(0.93);
add(new THREE.BoxGeometry(2.1, 0.05, 1.22), deskM, [0, T - 0.025, -0.19]);
for (const [x, z] of [[-0.98, -0.74], [0.98, -0.74], [-0.98, 0.36], [0.98, 0.36]])
  add(new THREE.BoxGeometry(0.05, T - 0.05, 0.05), deskM, [x, (T - 0.05) / 2, z]);
paperStack(-0.82, S, -0.42, 0.42, 0.3, 0.22);
paperStack(-0.72, S, -0.08, 0.2, 0.28, 0.2);

/* ================= доска ================= */
const CELL = 0.13, BTH = 0.035, B = S + BTH, BOARD_Z = 0.06;
const boardTex = canvasTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 26; i++) { const y = rnd(0, h); wobblyLine(ctx, 0, y, w, y + rnd(-10, 10), 3); }
  const sc = w / 0.44, half = 1.5 * CELL * sc, c = w / 2;
  ctx.strokeStyle = '#141418'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let pass = 0; pass < 2; pass++) {
    ctx.lineWidth = pass ? 3 : 6;
    wobblyLine(ctx, c - half, c - half, c + half, c - half, 2.5); wobblyLine(ctx, c + half, c - half, c + half, c + half, 2.5);
    wobblyLine(ctx, c + half, c + half, c - half, c + half, 2.5); wobblyLine(ctx, c - half, c + half, c - half, c - half, 2.5);
    for (const k of [-0.5, 0.5]) {
      const o = k * CELL * sc;
      wobblyLine(ctx, c + o, c - half, c + o, c + half, 3); wobblyLine(ctx, c - half, c + o, c + half, c + o, 3);
    }
  }
});
const bSide = M(0.85);
add(new THREE.BoxGeometry(0.44, BTH, 0.44), [bSide, bSide, M(1.0, { map: boardTex.tex }), bSide, bSide, bSide], [0, S + BTH / 2, BOARD_Z]);
const cellPos = (i, lift = 0) => V((i % 3 - 1) * CELL, B + 0.0216 + lift, BOARD_Z + (Math.floor(i / 3) - 1) * CELL);

/* ================= камни и чаши ================= */
const stoneGeo = new THREE.SphereGeometry(0.048, 28, 16); stoneGeo.scale(1, 0.45, 1);
const whiteM = M(1.0), blackM = M(0.015);
function makeStone(white) { const s = new THREE.Mesh(stoneGeo, white ? whiteM : blackM); s.castShadow = s.receiveShadow = true; scene.add(s); return s; }
function bowl(x, z, white) {
  const g = new THREE.Group(); g.position.set(x, S, z); scene.add(g);
  const r = 0.11, h = r * 0.62;
  const b = add(new THREE.SphereGeometry(r, 36, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), M(0.55, { side: THREE.DoubleSide }), [0, h, 0], g);
  b.scale.y = 0.62;
  add(new THREE.TorusGeometry(r, 0.008, 8, 48).rotateX(Math.PI / 2), M(0.5), [0, h, 0], g);
  for (let i = 0; i < 11; i++) {
    const s = new THREE.Mesh(stoneGeo, white ? whiteM : blackM);
    const a = i * 2.4, rr = i < 6 ? 0.045 : 0.02;
    s.position.set(Math.cos(a) * rr, 0.028 + (i < 6 ? 0 : 0.018), Math.sin(a) * rr);
    s.rotation.set(rnd(-0.2, 0.2), 0, rnd(-0.2, 0.2)); s.castShadow = true; g.add(s);
  }
  return g;
}
const whiteBowl = bowl(-0.46, 0.2, true);
const blackBowl = bowl(0.42, -0.4, false);
const bowlTop = (b) => b.position.clone().add(V(0, 0.07, 0));

/* ================= ноутбук ================= */
const laptop = new THREE.Group();
laptop.position.set(-0.33, S, -0.47);
laptop.rotation.y = Math.atan2(0.33, -0.43);
scene.add(laptop);
const alu = M(0.9);
add(new THREE.BoxGeometry(0.36, 0.018, 0.25), alu, [0, 0.009, 0], laptop);
const keysTex = canvasTex(256, 96, (ctx, w, h) => {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.6;
  for (let r = 0; r < 5; r++) for (let c = 0; c < 14; c++) { ctx.beginPath(); ctx.rect(5 + c * 18 + rnd(-1, 1), 5 + r * 18 + rnd(-1, 1), 13, 13); ctx.stroke(); }
});
add(new THREE.BoxGeometry(0.32, 0.002, 0.115), M(1.0, { map: keysTex.tex }), [0, 0.019, -0.035], laptop);
add(new THREE.BoxGeometry(0.11, 0.0015, 0.06), M(0.95), [0, 0.0185, 0.075], laptop);
const lid = new THREE.Group(); lid.position.set(0, 0.018, -0.125); lid.rotation.x = -0.28; laptop.add(lid);
add(new THREE.BoxGeometry(0.36, 0.24, 0.012), alu, [0, 0.12, 0], lid);
const sticker = canvasTex(128, 128, (ctx) => {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(64, 64, 52, 0.2, 6.6); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.font = `700 78px ${HAND}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('М', 64, 70);
});
const st = add(new THREE.CircleGeometry(0.04, 32), M(1.0, { map: sticker.tex }), [0.06, 0.15, -0.0065], lid, { cast: false });
st.rotation.y = Math.PI;

const SNIPPETS = [
`// крестики-нолики: мозг Макса
function думать(доска) {
  const ходы = свободные(доска);
  for (const х of ходы)
    if (выигрыш(доска, х)) return х;
  if (Math.random() < 0.2)
    return случайный(ходы); // шанс :)
  return минимакс(доска).ход;
}
`,
`/* дизайн-ревью в 15:00 */
.кнопка-победы {
  border: 2px solid black;
  border-radius: 16px;
  transform: rotate(-1deg);
}
`,

const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _pq = new THREE.Quaternion();
function rotateBoneWorld(bone, delta, weight = 1) {
  bone.getWorldQuaternion(_q);
  _q2.copy(delta).multiply(_q);                    // новая мировая ориентация
  if (weight < 1) _q2.slerpQuaternions(_q, _q2, weight);

  bone.quaternion.copy(_pq.multiply(_q2));
  bone.updateMatrixWorld(true);

function aim(bone, from, to, target, weight) {
  const cur = to.clone().sub(from).normalize(), des = target.clone().sub(from).normalize();
  rotateBoneWorld(bone, new THREE.Quaternion().setFromUnitVectors(cur, des), weight);
}
function solveArmIK(side, target, weight) {
  if (weight < 0.001) return;
  const pre = side > 0 ? 'Left' : 'Right';
  const up = bones[pre + 'Arm'], fo = bones[pre + 'ForeArm'], ha = bones[pre + 'Hand'];
  const Sp = up.getWorldPosition(V()), E0 = fo.getWorldPosition(V()), H0 = ha.getWorldPosition(V());
  const l1 = Sp.distanceTo(E0), l2 = E0.distanceTo(H0);
  const v = target.clone().sub(Sp); let d = v.length(); const dir = v.normalize();
  d = clamp(d, 0.05, (l1 + l2) * 0.995);
  const T = Sp.clone().add(dir.clone().multiplyScalar(d));
  const along = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - along * along));
  const pole = charRight.clone().multiplyScalar(side * 0.6).add(V(0, -1, 0)).add(charFwd.clone().multiplyScalar(-0.15));
  pole.sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  const E = Sp.clone().add(dir.clone().multiplyScalar(along)).add(pole.multiplyScalar(h));
  aim(up, Sp, E0, E, weight);
  const E1 = fo.getWorldPosition(V()), H1 = ha.getWorldPosition(V());
  aim(fo, E1, H1, T.clone().lerp(H1, 1 - weight), 1);

  const x = f.clone().cross(z).normalize();
  const want = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, f, z));
  const cur = ha.getWorldQuaternion(new THREE.Quaternion());
  rotateBoneWorld(ha, want.multiply(cur.clone().invert()), weight);
}

const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
function result(b) {
  for (const l of LINES) { const [a, c, d] = l; if (b[a] && b[a] === b[c] && b[a] === b[d]) return { w: b[a], line: l }; }
  return b.every(Boolean) ? { w: 'D' } : null;
}
function best(b, turn, depth = 0) {
  const r = result(b);
  if (r) return { s: r.w === 'B' ? 10 - depth : r.w === 'W' ? depth - 10 : 0 };
  let bm = null;
  for (let i = 0; i < 9; i++) if (!b[i]) {
    b[i] = turn; const v = best(b, turn === 'B' ? 'W' : 'B', depth + 1).s; b[i] = null;
    if (!bm || (turn === 'B' ? v > bm.s : v < bm.s) || (v === bm.s && Math.random() < 0.3)) bm = { s: v, i };
  }
  return bm;
}
function chooseMove(b) {
  const empty = [...Array(9).keys()].filter(i => !b[i]);
  const winIn = (p) => empty.find(i => { b[i] = p; const r = result(b); b[i] = null; return r && r.w === p; });
  const w = winIn('B'); if (w !== undefined) return w;
  const block = winIn('W'); if (block !== undefined && Math.random() < 0.85) return block;
  if (empty.length === 9) return [4, 0, 2, 6, 8][Math.floor(Math.random() * 5)];
  if (Math.random() < 0.2) return empty[Math.floor(Math.random() * empty.length)];
  return best(b, 'B').i;
}

  game.stones = []; game.bar = null; game.board = Array(9).fill(null);
  game.starter = game.starter === 'W' ? 'B' : 'W'; bot.react = null;
  if (game.starter === 'B') { game.state = 'anim'; bot.phase = 'type'; setStatus('теперь первым ходит макс'); say('Теперь я начинаю!', 1.8); later(0.8, startBotTurn); }
  else { startUserTurn(); say(pick(['Твой ход!', 'Давай, начинай', 'Ну-ка, ну-ка']), 1.8); }
}
againBtn.addEventListener('click', () => { ensureAudio(); newRound(); });

/* ================= камера и ввод ================= */
const camTarget = V(0, 1.0, -0.46);
const cam = { yaw: 0.35, pitch: 0.45, r: 1.95, tyaw: 0, tpitch: 0.28, tr: 1.75, px: 0, py: 0 };
const ndc = new THREE.Vector2(9, 9); let pointerIn = false;
let down = null, dragging = false, last = { x: 0, y: 0 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
canvas.addEventListener('pointerdown', (e) => { ensureAudio(); down = { x: e.clientX, y: e.clientY }; last = { ...down }; dragging = false; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} });
canvas.addEventListener('pointermove', (e) => {
  pointerIn = true;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  if (e.pointerType === 'mouse' && !down) { cam.px = ndc.x; cam.py = ndc.y; }
  if (down) {
    if (!dragging && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) dragging = true;
    if (dragging) {
      cam.tyaw = clamp(cam.tyaw - (e.clientX - last.x) * 0.006, -0.95, 0.95);
      cam.tpitch = clamp(cam.tpitch + (e.clientY - last.y) * 0.004, 0.08, 0.9);
      canvas.style.cursor = 'grabbing';
    }
    last = { x: e.clientX, y: e.clientY };
  }
});
canvas.addEventListener('pointerup', (e) => {
  if (down && !dragging) {
    ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    const i = hoverCell();
    if (i >= 0 && game.state === 'user' && !game.board[i]) userMove(i);
    else if (game.state === 'user' && Math.random() < 0.3) say(pick(['Кликай по клеткам доски', 'Камушки — на доску!']), 1.6);
  }
  down = null; dragging = false; canvas.style.cursor = '';
});
canvas.addEventListener('pointerleave', () => { pointerIn = false; cam.px = 0; cam.py = 0; });
canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.tr = clamp(cam.tr + e.deltaY * 0.0012, 0.9, 2.6); }, { passive: false });

const ray = new THREE.Raycaster(), boardPlane = new THREE.Plane(V(0, 1, 0), -B), hit = V();
function hoverCell() {
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(boardPlane, hit)) return -1;
  const c = Math.round(hit.x / CELL) + 1, r = Math.round((hit.z - BOARD_Z) / CELL) + 1;
  if (c < 0 || c > 2 || r < 0 || r > 2) return -1;
  if (Math.abs(hit.x - (c - 1) * CELL) > CELL * 0.5 || Math.abs(hit.z - BOARD_Z - (r - 1) * CELL) > CELL * 0.5) return -1;
  return r * 3 + c;
}
const ghost = new THREE.Mesh(stoneGeo, new THREE.MeshBasicMaterial({ color: 0x777777, transparent: true, opacity: 0.35, depthWrite: false }));
ghost.visible = false; scene.add(ghost); noNormalPass.push(ghost);

function updateCamera(dt) {
  const a = 1 - Math.exp(-dt * 6);
  cam.yaw += (cam.tyaw + cam.px * 0.09 - cam.yaw) * a;
  cam.pitch += (cam.tpitch + cam.py * 0.04 - cam.pitch) * a;
  cam.r += (cam.tr - cam.r) * a;
  const rr = cam.r * (camera.aspect < 1 ? 1.15 + (1 - camera.aspect) * 0.8 : 1);
  camera.position.set(camTarget.x + rr * Math.cos(cam.pitch) * Math.sin(cam.yaw), camTarget.y + rr * Math.sin(cam.pitch), camTarget.z + rr * Math.cos(cam.pitch) * Math.cos(cam.yaw));
  camera.lookAt(camTarget);
}

/* ================= анимация Макса ================= */
const lookAt = V(0, 0.9, -0.4);
let lean = 0, slide = 0, headW8 = 0;
let yawCur = CHAR.yaw, yawTgt = CHAR.yaw;                 // кресло поворачивается к цели
const yawTo = (p) => Math.atan2(p.x - CHAR.x, p.z - CHAR.z);

function botUpdate(dt, t) {
  bot.t += dt;
  if (bot.phase === 'think' && bot.t > bot.dur) { bot.cell = chooseMove(game.board); bot.phase = 'toBowl'; bot.t = 0; }
  else if (bot.phase === 'toBowl' && bot.t > 0.7) { bot.phase = 'grab'; bot.t = 0; }
  else if (bot.phase === 'grab' && bot.t > 0.3) { bot.stone = makeStone(false); bot.phase = 'toCell'; bot.t = 0; }
  else if (bot.phase === 'toCell' && bot.t > 0.9) { bot.phase = 'drop'; bot.t = 0; }
  else if (bot.phase === 'drop' && bot.t > 0.3) {
    const s = bot.stone, from = s.position.clone(), to = cellPos(bot.cell);
    const dd = from.distanceTo(to); tween(0.12 + dd * 0.9, (k) => { const e = 1 - (1 - k) * (1 - k); s.position.lerpVectors(from, to, e); s.position.y += Math.sin(Math.PI * k) * Math.min(0.04, dd * 0.3); }, () => tok(0.85));
    game.board[bot.cell] = 'B'; game.stones.push(s); bot.stone = null;
    bot.phase = 'type'; bot.t = 0;
    if (!checkEnd()) startUserTurn();
  }
  // экран печатает, пока он печатает
  if (bot.phase === 'type') {
    if (typePause > 0) { typePause -= dt; if (typePause <= 0) { snip = (snip + 1) % SNIPPETS.length; typed = 0; screenDirty = true; } }
    else { typeAcc += dt * 16; const n = Math.floor(typeAcc); if (n) { typeAcc -= n; typed = Math.min(SNIPPETS[snip].length, typed + n); screenDirty = true; if (typed >= SNIPPETS[snip].length) typePause = 1.4; } }
  }
  if (!remy) return;

  // 0) поворот на кресле (цель — с прошлого кадра)
  yawCur += (yawTgt - yawCur) * (1 - Math.exp(-dt * 3.2));
  charRoot.rotation.y = yawCur; chairGroup.rotation.y = yawCur;
  charFwd.set(Math.sin(yawCur), 0, Math.cos(yawCur)); charRight.set(Math.cos(yawCur), 0, -Math.sin(yawCur));

  // 1) базовая анимация печати
  mixer.update(dt);
  charRoot.updateMatrixWorld(true);
  const hp = bones.Head.getWorldPosition(V()), ht = bones.HeadTop_End.getWorldPosition(V());
  const headC = hp.clone().lerp(ht, 0.45);
  head.position.copy(headC);
  const shL = bones.LeftArm.getWorldPosition(V()), shR = bones.RightArm.getWorldPosition(V());

  // 2) цели по фазам
  const tA = V(), tB = V();
  let wA = 0, wB = 0, look = null, lookW = 0, leanT = 0, slideT = 0, k = 9;
  const UP = V(0, 1, 0);
  yawTgt = CHAR.yaw;
  const deskRest = () => { const a = bones.RightUpLeg.getWorldPosition(V()), k2 = bones.RightLeg.getWorldPosition(V()); return a.lerp(k2, 0.62).add(V(0, 0.075, 0)); };   // ладонь на бедре
  switch (bot.phase) {
    case 'type':
      if (game.state === 'user' || game.state === 'over') {
        bot.glance -= dt; bot.nextGlance -= dt;
        if (bot.nextGlance < 0) { bot.glance = 1.4; bot.nextGlance = 4 + Math.random() * 5; }
        if (bot.glance > 0) { look = camera.position.clone(); lookW = 0.85; }
      }
      break;
    case 'think':
      wA = 1; k = 6;
      if (bot.style === 'scratch') tA.copy(headC).add(charRight.clone().multiplyScalar(0.1)).add(V(0, 0.07 + Math.sin(t * 18) * 0.015, 0)).add(charFwd.clone().multiplyScalar(-0.01 + Math.cos(t * 18) * 0.012));
      else tA.copy(headC).add(charFwd.clone().multiplyScalar(0.11)).add(V(0, -0.11, 0));
      look = V(Math.sin(t * 1.5) * 0.12, B, BOARD_Z); lookW = 0.8; leanT = 0.1;
      yawTgt = CHAR.yaw * 0.55 + yawTo(V(0, 0, BOARD_Z)) * 0.45;
      break;
    case 'toBowl': case 'grab':
      wA = 1; tA.copy(blackBowl.position).add(V(0, bot.phase === 'grab' ? 0.075 : 0.15, 0));
      wB = 1; tB.copy(deskRest());
      look = blackBowl.position.clone(); lookW = 0.6; leanT = 0.4; slideT = 0.12; k = 6;
      yawTgt = yawTo(blackBowl.position) - 0.28;
      break;
    case 'toCell': case 'drop':
      wA = 1; tA.copy(cellPos(bot.cell, bot.phase === 'drop' ? 0.07 : 0.12));
      wB = 1; tB.copy(deskRest());
      look = cellPos(bot.cell); lookW = 0.6; leanT = 0.66; slideT = 0.3; k = 6;
      yawTgt = yawTo(cellPos(bot.cell)) - 0.28;
      break;
    case 'react':
      k = 6;
      if (bot.react === 'B') {          // радуется: руки вверх
        wA = wB = 1;
        tA.copy(shL).add(V(0, 0.42 + Math.sin(t * 9) * 0.04, 0)).add(charRight.clone().multiplyScalar(0.12));
        tB.copy(shR).add(V(0, 0.42 + Math.sin(t * 9 + 1.5) * 0.04, 0)).add(charRight.clone().multiplyScalar(-0.12));
        look = camera.position.clone(); lookW = 0.9; leanT = -0.08;
      } else if (bot.react === 'W') {   // фейспалм
        wA = 1; tA.copy(headC).add(charFwd.clone().multiplyScalar(0.12)).add(V(0, 0.02, 0));
        look = V(0, 0.7, -0.2); lookW = 0.7; leanT = 0.2;
      } else {                          // пожимает плечами
        wA = wB = 1; const sh = Math.sin(t * 4) * 0.03;
        tA.copy(shL).add(charRight.clone().multiplyScalar(0.25)).add(charFwd.clone().multiplyScalar(0.22)).add(V(0, -0.08 + sh, 0));
        tB.copy(shR).add(charRight.clone().multiplyScalar(-0.25)).add(charFwd.clone().multiplyScalar(0.22)).add(V(0, -0.08 + sh, 0));
        look = camera.position.clone(); lookW = 0.9;
      }
      break;
  }
  // 3) сглаживание весов и целей
  const a = 1 - Math.exp(-dt * k), aw = 1 - Math.exp(-dt * 5);
  for (const [s, w, tg] of [[1, wA, tA], [-1, wB, tB]]) {
    const arm = arms[s];
    const animHand = bones[(s > 0 ? 'Left' : 'Right') + 'Hand'].getWorldPosition(V());
    if (arm.w < 0.01 && w === 0) arm.pos.copy(animHand);
    arm.pos.lerp(w ? tg : animHand, a);
    arm.w += (w - arm.w) * aw;
  }
  lean += (leanT - lean) * aw; slide += (slideT - slide) * aw;
  if (look) lookAt.lerp(look, 1 - Math.exp(-dt * 6));
  headW8 += (lookW - headW8) * aw;

  // 4) применяем: сдвиг на стуле, наклон, взгляд, руки
  remy.position.set(0, 0, slide / CHAR.scale);
  remy.updateMatrixWorld(true);
  bendSpine(lean);
  twistSpine(arms[1].pos, arms[1].w * 0.35);
  lookHead(lookAt, headW8);
  solveArmIK(1, arms[1].pos, arms[1].w);
  solveArmIK(-1, arms[-1].pos, arms[-1].w);
  orientHand(1, arms[1].pos, arms[1].w);
  orientHand(-1, arms[-1].pos.clone().add(charFwd.clone().multiplyScalar(0.3)), arms[-1].w, 0.15);
  if (bot.stone) {   // камень зажат между большим и указательным
    const a = bones.LeftHandThumb4.getWorldPosition(V()), b2 = bones.LeftHandIndex4.getWorldPosition(V()), c2 = bones.LeftHandMiddle4.getWorldPosition(V());
    bot.stone.position.copy(a).add(b2).add(c2).multiplyScalar(1 / 3).add(V(0, -0.012, 0));
  }
}

/* ================= цикл ================= */
const clk = new THREE.Clock();
let screenTimer = 0;
let frameNo = 0;
function render() {
  renderer.shadowMap.needsUpdate = (frameNo++ % 2 === 0);   // тени — через кадр
  renderer.setClearColor(PAPER_BG, 1);
  renderer.setRenderTarget(rtColor); renderer.clear(); renderer.render(scene, camera);
  noNormalPass.forEach(o => { o.userData.v = o.visible; o.visible = false; });
  scene.overrideMaterial = normalMat;
  renderer.setClearColor(NORMAL_BG, 1);
  renderer.setRenderTarget(rtNormal); renderer.clear(); renderer.render(scene, camera);
  scene.overrideMaterial = null;
  noNormalPass.forEach(o => { o.visible = o.userData.v; });
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
let lastFrame = 0, lastActivity = performance.now(), perfAcc = 0, perfN = 0, perfGood = 0;
for (const ev of ['pointermove', 'pointerdown', 'wheel', 'keydown', 'touchstart']) addEventListener(ev, () => { lastActivity = performance.now(); }, { passive: true });
function adaptQuality(frameMs, fps) {
  // если не успеваем в целевую частоту — снижаем разрешение, если с запасом — возвращаем
  perfAcc += frameMs; perfN++;
  if (perfN < fps * 2) return;
  const avg = perfAcc / perfN, budget = 1000 / fps; perfAcc = 0; perfN = 0;
  if (avg > budget * 1.3 && DPR > MIN_DPR) { DPR = Math.max(MIN_DPR, DPR - 0.25); perfGood = 0; resize(); }
  else if (avg < budget * 1.08 && DPR < MAX_DPR && ++perfGood >= 5) { DPR = Math.min(MAX_DPR, DPR + 0.25); perfGood = 0; resize(); }
}
function loop(now = performance.now()) {
  requestAnimationFrame(loop);
  const idle = game.state === 'user' && now - lastActivity > IDLE_AFTER && bubbleT <= 0;
  const fps = idle ? IDLE_FPS : TARGET_FPS;
  if (now - lastFrame < 1000 / fps - 3) return;
  const frameMs = now - lastFrame; lastFrame = now;
  if (!idle && frameMs < 500) adaptQuality(frameMs, fps);
  const dt = Math.min(clk.getDelta(), 0.15), t = clk.elapsedTime;
  shared.uBoil.value = Math.floor(t * 8) % 97;   // «кипение» линий, как в ротоскопии
  updateCamera(dt);
  for (const tw of tweens.slice()) {
    tw.t += dt; if (tw.t < 0) continue;
    const k = Math.min(1, tw.t / tw.dur); tw.fn(k);
    if (k >= 1) { tweens.splice(tweens.indexOf(tw), 1); tw.done && tw.done(); }
  }
  botUpdate(dt, t);

  const hc = (pointerIn && !dragging && game.state === 'user') ? hoverCell() : -1;
  if (hc >= 0 && !game.board[hc]) { ghost.visible = true; ghost.position.copy(cellPos(hc)); canvas.style.cursor = 'pointer'; }
  else { ghost.visible = false; if (!dragging) canvas.style.cursor = ''; }

  const side = game.state === 'user' ? -1 : (game.state === 'bot' ? 1 : 0);
  if (side) clockHands[side].rotation.z -= dt * 1.6;

  screenTimer -= dt;
  const bOn = Math.floor(t * 2) % 2 === 0;
  if ((screenDirty || bOn !== blinkState) && screenTimer <= 0) { blinkState = bOn; scr.redraw(); screenDirty = false; screenTimer = 0.08; }

  if (game.state === 'user') {
    userIdle += dt;
    if (userIdle > nextNudge) { say(pick(['Ну что, ходишь?', 'Я подожду, допишу пока…', 'Не торопись, думай', 'Твой ход, кстати!']), 2.4); userIdle = 0; nextNudge = 11 + Math.random() * 8; }
  }
  if (bubbleT > 0) {
    bubbleT -= dt; if (bubbleT <= 0) bubble.style.opacity = 0;
    const p = head.getWorldPosition(V()).add(V(0.28, 0.08, 0)).project(camera);
    bubble.style.left = (p.x * 0.5 + 0.5) * innerWidth + 'px';
    bubble.style.top = (-p.y * 0.5 + 0.5) * innerHeight + 'px';
  }
  render();
}
resize();
later(0.8, () => say('Привет! Сыграем? Ты первый', 3));
loop();
</script>
